name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

env:
  REFORGE_VERSION: 0.2.0

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v'+p.version) process.exit(1)"
      - name: Install Reforge gate
        run: cargo install --git https://github.com/LyleMi/Reforge --rev fd5a11ce8271e70dddd4dca75d51f08d05235669 --locked reforge
      - name: Verify Reforge version
        run: test "$(reforge --version)" = "reforge $REFORGE_VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm publish --provenance --access public --tag beta --no-git-checks
