version = 2

[analysis]
enabled = ["codebase"]

[scope]
ignore-paths = []

[rules]
enable = [
  "reforge.codebase.complex_function",
  "reforge.codebase.deep_nesting",
  "reforge.codebase.many_parameters",
  "reforge.codebase.large_type",
]

[codebase]
preset = "balanced"
max-file-lines = 800
max-dir-files = 40
min-similar-functions = 3
min-function-tokens = 80
function-similarity = 0.85
max-function-lines = 80
max-function-complexity = 15
max-nesting-depth = 4
max-function-parameters = 5
max-type-lines = 250
max-type-members = 30
max-imports = 35
max-public-items = 30
max-functions-per-file = 40
max-functions-per-100-lines = 12
max-small-function-ratio = 70
min-repeated-literal-occurrences = 12
min-data-clump-occurrences = 4
churn = "off"
churn-window-days = 180
churn-max-commit-lines = 2000
